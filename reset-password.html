<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — ReconciliationPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141B22;
    --ink-soft:#1F2932;
    --paper:#F3F4F1;
    --paper-raised:#FFFFFF;
    --teal:#1C4A47;
    --teal-light:#2E6B66;
    --brass-soft:#E8D3AA;
    --rust:#A8432C;
    --slate:#5B6670;
    --line:#DADDD7;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  [hidden]{ display:none !important; }
  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 16px;
  }
  .card{
    width:100%; max-width:420px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:36px 32px;
  }
  .brand{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; margin:0 0 22px; }
  .brand em{ font-style:normal; color:#B8863B; }
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:26px; margin:0 0 8px; }
  .sub{ font-size:14px; color:var(--slate); margin:0 0 24px; line-height:1.5; }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:7px; }
  .field input{
    width:100%; padding:12px 14px; font-size:15px; font-family:inherit; color:var(--ink);
    background:var(--paper-raised); border:1.5px solid var(--line); border-radius:8px; outline:none;
  }
  .field input:focus{ border-color:var(--teal); box-shadow:0 0 0 3px rgba(28,74,71,.12); }

  .pw-checklist{ display:flex; flex-wrap:wrap; gap:6px 14px; margin:10px 0 2px; }
  .pw-checklist span{ font-size:11.5px; color:#A7ACA6; display:flex; align-items:center; gap:5px; }
  .pw-checklist span::before{ content:''; width:5px; height:5px; border-radius:50%; background:#C7CBC4; }
  .pw-checklist span.ok{ color:var(--teal); }
  .pw-checklist span.ok::before{ background:var(--teal); }

  .btn-primary{
    width:100%; padding:13px; background:var(--teal); color:#FFFFFF;
    font-family:inherit; font-size:15px; font-weight:600; border:none; border-radius:8px; cursor:pointer;
  }
  .btn-primary:hover{ background:var(--teal-light); }
  .btn-primary:disabled{ opacity:.6; cursor:default; }

  .msg{ display:none; font-size:13.5px; line-height:1.5; padding:12px 14px; border-radius:8px; margin:0 0 18px; }
  .msg.show{ display:block; }
  .msg.err{ background:#FBEAE6; color:var(--rust); }
  .msg.ok{ background:#E2EEEC; color:var(--teal); }

  .foot{ text-align:center; margin-top:22px; font-size:13.5px; color:var(--slate); }
  .foot a{ color:var(--teal); font-weight:600; text-decoration:none; }
  .foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<main class="card">
  <p class="brand">Reconciliation<em>Pro</em></p>

  <!-- Hakbang 1: humingi ng reset link -->
  <section id="requestView">
    <h1>Forgot password</h1>
    <p class="sub">Enter the email you registered with. We'll send you a link to set a new password.</p>
    <div class="msg" id="requestMsg" role="status" aria-live="polite"></div>
    <form id="requestForm">
      <div class="field">
        <label for="resetEmail">Email</label>
        <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <button type="submit" class="btn-primary" id="requestBtn">Send reset link</button>
    </form>
  </section>

  <!-- Hakbang 2: galing sa email link → bagong password -->
  <section id="updateView" hidden>
    <h1>Set a new password</h1>
    <p class="sub">Choose a new password for your account.</p>
    <div class="msg" id="updateMsg" role="status" aria-live="polite"></div>
    <form id="updateForm">
      <div class="field">
        <label for="newPass">New password</label>
        <input type="password" id="newPass" autocomplete="new-password" required>
        <div class="pw-checklist" id="pwChecklist">
          <span data-rule="len">8+ characters</span>
          <span data-rule="upper">Uppercase letter</span>
          <span data-rule="num">Number</span>
        </div>
      </div>
      <div class="field">
        <label for="newPassConfirm">Confirm new password</label>
        <input type="password" id="newPassConfirm" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn-primary" id="updateBtn">Save new password</button>
    </form>
  </section>

  <p class="foot"><a href="login.html">Back to sign in</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
        integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
        crossorigin="anonymous"></script>
<script src="js/supabase-client.js"></script>
<script>
(function(){
  const $ = function(id){ return document.getElementById(id); };
  const requestView = $('requestView'), updateView = $('updateView');

  function show(el, text, kind){ el.textContent = text; el.className = 'msg show ' + kind; }

  function showUpdateView(){
    requestView.hidden = true;
    updateView.hidden = false;
    $('newPass').focus();
  }

  // ---------- Galing sa email link ----------
  // Sinusuri ang error sa URL (hal. expired na link) bago ang lahat
  const hash = new URLSearchParams(window.location.hash.slice(1));
  const query = new URLSearchParams(window.location.search);
  const linkError = hash.get('error_description') || query.get('error_description');
  if (linkError) {
    show($('requestMsg'), 'This reset link is invalid or has expired. Please request a new one.', 'err');
    history.replaceState(null, '', window.location.pathname);
  }

  // Kapag galing sa recovery link, gagawa ang supabase-js ng session at magpapadala ng PASSWORD_RECOVERY
  sb.auth.onAuthStateChange(function(event){
    if (event === 'PASSWORD_RECOVERY') showUpdateView();
  });
  if (hash.get('type') === 'recovery') showUpdateView();

  // ---------- Hakbang 1: humingi ng link ----------
  $('requestForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const btn = $('requestBtn');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    try {
      const { error } = await sb.auth.resetPasswordForEmail($('resetEmail').value.trim(), {
        redirectTo: new URL('reset-password.html', window.location.href).href
      });
      if (error && /rate limit|security purposes/i.test(error.message)) {
        show($('requestMsg'), 'Too many requests. Please wait a few minutes and try again.', 'err');
        return;
      }
      // Iisang mensahe kahit wala ang email (para hindi malaman kung sino ang naka-register)
      show($('requestMsg'), 'If an account exists for this email, we sent a link to reset your password. ' +
                            'Check your inbox and spam folder.', 'ok');
      this.reset();
    } catch (err) {
      show($('requestMsg'), 'Could not send right now. Check your connection and try again.', 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send reset link';
    }
  });

  // ---------- Hakbang 2: bagong password ----------
  const pw = $('newPass'), checklist = $('pwChecklist');
  pw.addEventListener('input', function(){
    const v = pw.value;
    checklist.querySelector('[data-rule="len"]').classList.toggle('ok', v.length >= 8);
    checklist.querySelector('[data-rule="upper"]').classList.toggle('ok', /[A-Z]/.test(v));
    checklist.querySelector('[data-rule="num"]').classList.toggle('ok', /[0-9]/.test(v));
  });

  $('updateForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const v = pw.value;
    if (v.length < 8 || !/[A-Z]/.test(v) || !/[0-9]/.test(v)) {
      show($('updateMsg'), 'Password needs at least 8 characters, an uppercase letter, and a number.', 'err');
      return;
    }
    if (v !== $('newPassConfirm').value) {
      show($('updateMsg'), 'Passwords do not match.', 'err');
      return;
    }
    const btn = $('updateBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        show($('updateMsg'), 'This reset link has expired. Please request a new one.', 'err');
        return;
      }
      const { error } = await sb.auth.updateUser({ password: v });
      if (error) {
        show($('updateMsg'), /different from the old/i.test(error.message)
          ? 'Your new password must be different from your old password.'
          : 'Could not save the new password: ' + error.message, 'err');
        return;
      }
      // Mag-sign out para mag-login ulit gamit ang bagong password (dadaan sa status/role check)
      await sb.auth.signOut({ scope: 'local' });
      this.reset();
      $('updateForm').hidden = true;
      show($('updateMsg'), 'Your password has been changed. You can now sign in with your new password.', 'ok');
      history.replaceState(null, '', window.location.pathname);
    } catch (err) {
      show($('updateMsg'), 'Could not save right now. Check your connection and try again.', 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save new password';
    }
  });
})();
</script>
</body>
</html>
